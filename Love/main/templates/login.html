<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід до нашого світу 💕</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-rose-50/50 p-4 text-gray-800">
    <main class="mx-auto grid min-h-screen max-w-4xl content-center gap-6 md:grid-cols-2">
        {% if messages %}
            <div class="space-y-2 md:col-span-2" role="alert">
                {% for message in messages %}
                    <p class="rounded-xl bg-rose-50 px-4 py-3 text-sm text-rose-700">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <section class="rounded-3xl border border-rose-100 bg-white p-8 shadow-lg">
            <div class="mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-rose-100 text-2xl text-rose-500">
                <i class="fa-solid fa-heart"></i>
            </div>
            <h1 class="mb-1 text-2xl font-bold">Увійти</h1>
            <p class="mb-6 text-sm text-gray-500">Введіть логін і пароль вашого акаунта.</p>

            <form method="POST" action="{% url 'login' %}" class="space-y-4">
                {% csrf_token %}
                {% if login_form.non_field_errors %}
                    <div class="rounded-xl bg-rose-50 p-3 text-sm text-rose-700">
                        {{ login_form.non_field_errors }}
                    </div>
                {% endif %}
                <div>
                    <label for="{{ login_form.username.id_for_label }}" class="mb-1 block text-xs font-semibold text-gray-600">Логін</label>
                    <input type="text" name="username" id="{{ login_form.username.id_for_label }}" autocomplete="username" required
                           value="{{ login_form.username.value|default:'' }}"
                           class="w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm focus:border-rose-400 focus:outline-none">
                </div>
                <div>
                    <label for="{{ login_form.password.id_for_label }}" class="mb-1 block text-xs font-semibold text-gray-600">Пароль</label>
                    <input type="password" name="password" id="{{ login_form.password.id_for_label }}" autocomplete="current-password" required
                           class="w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm focus:border-rose-400 focus:outline-none">
                </div>
                <button type="submit" class="w-full rounded-xl bg-rose-500 py-3 text-sm font-medium text-white shadow transition hover:bg-rose-600">
                    Увійти 💌
                </button>
            </form>
        </section>
    </main>
</body>
</html>
